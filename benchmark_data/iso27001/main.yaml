    conforms_to: https://www.w3.org/TR/curie/
    description: a compact URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "curie".
    comments:
    - in RDF serializations this MUST be expanded to a URI
    - in non-RDF serializations MAY be serialized as the compact representation
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: Curie
    uri: xsd:string
    repr: str
  uri:
    name: uri
    definition_uri: https://w3id.org/linkml/Uri
    conforms_to: https://www.ietf.org/rfc/rfc3987.txt
    description: a complete URI
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "uri".
    comments:
    - in RDF serializations a slot with range of uri is treated as a literal or type
      xsd:anyURI unless it is an identifier or a reference to an identifier, in which
      case it is translated directly to a node
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    close_mappings:
    - schema:URL
    base: URI
    uri: xsd:anyURI
    repr: str
  ncname:
    name: ncname
    definition_uri: https://w3id.org/linkml/Ncname
    description: Prefix part of CURIE
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "ncname".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NCName
    uri: xsd:string
    repr: str
  objectidentifier:
    name: objectidentifier
    definition_uri: https://w3id.org/linkml/Objectidentifier
    description: A URI or CURIE that represents an object in the model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "objectidentifier".
    comments:
    - Used for inheritance and type checking
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: ElementIdentifier
    uri: shex:iri
    repr: str
  nodeidentifier:
    name: nodeidentifier
    definition_uri: https://w3id.org/linkml/Nodeidentifier
    description: A URI, CURIE or BNODE that represents a node in a model.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "nodeidentifier".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: NodeIdentifier
    uri: shex:nonLiteral
    repr: str
  jsonpointer:
    name: jsonpointer
    definition_uri: https://w3id.org/linkml/Jsonpointer
    conforms_to: https://datatracker.ietf.org/doc/html/rfc6901
    description: A string encoding a JSON Pointer. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to a valid object within the current
      instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpointer".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  jsonpath:
    name: jsonpath
    definition_uri: https://w3id.org/linkml/Jsonpath
    conforms_to: https://www.ietf.org/archive/id/draft-goessner-dispatch-jsonpath-00.html
    description: A string encoding a JSON Path. The value of the string MUST conform
      to JSON Point syntax and SHOULD dereference to zero or more valid objects within
      the current instance document when encoded in tree form.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "jsonpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
  sparqlpath:
    name: sparqlpath
    definition_uri: https://w3id.org/linkml/Sparqlpath
    conforms_to: https://www.w3.org/TR/sparql11-query/#propertypaths
    description: A string encoding a SPARQL Property Path. The value of the string
      MUST conform to SPARQL syntax and SHOULD dereference to zero or more valid objects
      within the current instance document when encoded as RDF.
    notes:
    - If you are authoring schemas in LinkML YAML, the type is referenced with the
      lower case "sparqlpath".
    from_schema: https://w3id.org/linkml/types
    imported_from: linkml:types
    base: str
    uri: xsd:string
    repr: str
enums:
  ControlCategory:
    name: ControlCategory
    definition_uri: https://w3id.org/lmodel/iso27001/ControlCategory
    annotations:
      iso27002_mapping:
        tag: iso27002_mapping
        value: Clauses 5-8
    description: The four control domains defined in ISO/IEC 27001:2022 Annex A, corresponding
      to Clauses 5-8 of ISO/IEC 27002:2022.
    in_subset:
    - annex_a_controls
    from_schema: https://w3id.org/lmodel/iso27001
    permissible_values:
      organizational:
        text: organizational
        description: Organizational controls (Annex A.5) - policies, roles, asset
          management, access control, supplier relationships, incident management,
          compliance.
        annotations:
          annex_clause:
            tag: annex_clause
            value: '5'
          control_count:
            tag: control_count
            value: '37'
      people:
        text: people
        description: People controls (Annex A.6) - screening, employment terms, awareness,
          disciplinary process, termination responsibilities, remote working.
        annotations:
          annex_clause:
            tag: annex_clause
            value: '6'
          control_count:
            tag: control_count
            value: '8'
      physical:
        text: physical
        description: Physical controls (Annex A.7) - perimeters, entry controls, equipment
          protection, secure areas, media handling, cabling, maintenance.
        annotations:
          annex_clause:
            tag: annex_clause
            value: '7'
          control_count:
            tag: control_count
            value: '14'
      technological:
        text: technological
        description: Technological controls (Annex A.8) - endpoint security, access
          restrictions, authentication, malware protection, logging, cryptography,
          secure development.
        annotations:
          annex_clause:
            tag: annex_clause
            value: '8'
          control_count:
            tag: control_count
            value: '34'
  ImplementationStatus:
    name: ImplementationStatus
    definition_uri: https://w3id.org/lmodel/iso27001/ImplementationStatus
    description: Lifecycle status of a security control, used in Statement of Applicability
      and control tracking.
    in_subset:
    - annex_a_controls
    from_schema: https://w3id.org/lmodel/iso27001
    exact_mappings:
    - iso42001:ImplementationStatus
    permissible_values:
      not_started:
        text: not_started
        description: Control identified but no implementation activities begun.
      planned:
        text: planned
        description: Control scheduled for implementation with defined timeline.
      in_progress:
        text: in_progress
        description: Implementation actively underway but not yet complete.
      implemented:
        text: implemented
        description: Control fully implemented and operational.
      not_applicable:
        text: not_applicable
        description: Control excluded from scope with documented justification per
          6.1.3 d).
        comments:
        - Requires justification in Statement of Applicability
  RiskTreatmentOption:
    name: RiskTreatmentOption
    definition_uri: https://w3id.org/lmodel/iso27001/RiskTreatmentOption
    annotations:
      iso31000_reference:
        tag: iso31000_reference
        value: Clause 6.5
    description: Standard risk treatment options per ISO 31000 and ISO 27005.
    in_subset:
    - risk_management
    from_schema: https://w3id.org/lmodel/iso27001
    exact_mappings:
    - iso42001:RiskTreatmentOption
    permissible_values:
      modify:
        text: modify
        description: Apply controls to change the risk level (reduce likelihood or
          impact).
        aliases:
        - mitigate
        - reduce
      accept:
        text: accept
        description: Accept the risk without further treatment, within risk appetite.
          Requires risk owner approval.
        aliases:
        - retain
      avoid:
        text: avoid
        description: Eliminate the risk by removing the activity or asset that creates
          it.
        aliases:
        - terminate
      share:
        text: share
        description: Transfer or share risk with external parties (e.g., insurance,
          outsourcing).
        aliases:
        - transfer
  RiskLevel:
    name: RiskLevel
    definition_uri: https://w3id.org/lmodel/iso27001/RiskLevel
    description: Qualitative risk rating derived from likelihood x impact analysis.
    in_subset:
    - risk_management
    from_schema: https://w3id.org/lmodel/iso27001
    exact_mappings:
    - iso42001:RiskLevel
    permissible_values:
      very_low:
        text: very_low
        description: Negligible risk requiring no immediate action.
      low:
        text: low
        description: Minor risk manageable through routine procedures.
      medium:
        text: medium
        description: Moderate risk requiring management attention and planned controls.
      high:
        text: high
        description: Significant risk requiring priority treatment and escalation.
      critical:
        text: critical
        description: Severe risk threatening organizational objectives; requires immediate
          executive action and resource allocation.
  DocumentType:
    name: DocumentType
    definition_uri: https://w3id.org/lmodel/iso27001/DocumentType
    description: Categories of documented information required or recommended by ISO
      27001.
    in_subset:
    - documented_information
    from_schema: https://w3id.org/lmodel/iso27001
    exact_mappings:
    - iso42001:DocumentType
    permissible_values:
      policy:
        text: policy
        description: High-level statement of intent and direction (e.g., IS policy
          per 5.2).
      procedure:
        text: procedure
        description: Documented steps for performing activities consistently.
      standard:
        text: standard
        description: Mandatory requirements for specific technologies or processes.
      guideline:
        text: guideline
        description: Recommended practices that support policies and procedures.
      record:
        text: record
        description: Evidence of activities performed or results achieved.
      plan:
        text: plan
        description: Documented approach for achieving objectives (e.g., risk treatment
          plan).
      report:
        text: report
        description: Formal output of assessment, audit, or review activities.
  AuditFindingType:
    name: AuditFindingType
    definition_uri: https://w3id.org/lmodel/iso27001/AuditFindingType
    description: Classification of internal audit findings.
    in_subset:
    - performance_evaluation
    from_schema: https://w3id.org/lmodel/iso27001
    exact_mappings:
    - iso42001:AuditFindingType
    permissible_values:
      major_nonconformity:
        text: major_nonconformity
        description: Significant failure to fulfill a requirement that affects ISMS
          capability to achieve intended outcomes.
      minor_nonconformity:
        text: minor_nonconformity
        description: Isolated lapse that does not significantly affect ISMS effectiveness.
      observation:
        text: observation
        description: Noted condition that could lead to nonconformity if not addressed.
        aliases:
        - opportunity_for_improvement
      positive_finding:
        text: positive_finding
        description: Evidence of effective implementation exceeding requirements.
  LikelihoodRating:
    name: LikelihoodRating
    definition_uri: https://w3id.org/lmodel/iso27001/LikelihoodRating
    description: Qualitative likelihood scale for risk assessment.
    in_subset:
    - risk_management
    from_schema: https://w3id.org/lmodel/iso27001
    exact_mappings:
    - iso42001:LikelihoodRating
    permissible_values:
      rare:
        text: rare
        description: Highly unlikely to occur (< 5% probability).
        annotations:
          numeric_value:
            tag: numeric_value
            value: '1'
      unlikely:
        text: unlikely
        description: Not expected but possible (5-20% probability).
        annotations:
          numeric_value:
            tag: numeric_value
            value: '2'
      possible:
        text: possible
        description: May occur at some point (20-50% probability).
        annotations:
          numeric_value:
            tag: numeric_value
            value: '3'
      likely:
        text: likely
        description: Probably will occur (50-80% probability).
        annotations:
          numeric_value:
            tag: numeric_value
            value: '4'
      almost_certain:
        text: almost_certain
        description: Expected to occur in most circumstances (> 80% probability).
        annotations:
          numeric_value:
            tag: numeric_value
            value: '5'
  CIAProperty:
    name: CIAProperty
    definition_uri: https://w3id.org/lmodel/iso27001/CIAProperty
    annotations:
      iso27001_clause:
        tag: iso27001_clause
        value: 6.1.2 c) 1)
    description: Information security properties whose loss is considered when identifying
      risks per ISO/IEC 27001:2022 Clause 6.1.2 c) 1).
    in_subset:
    - risk_management
    from_schema: https://w3id.org/lmodel/iso27001
    permissible_values:
      confidentiality:
        text: confidentiality
        description: Property of information not being made available or disclosed
          to unauthorized entities.
      integrity:
        text: integrity
        description: Property of accuracy and completeness of information.
      availability:
        text: availability
        description: Property of being accessible and usable on demand by an authorized
          entity.
  AuditType:
    name: AuditType
    definition_uri: https://w3id.org/lmodel/iso27001/AuditType
    annotations:
      iso27001_clause:
        tag: iso27001_clause
        value: '9.2'
    description: Classification of audits referenced by ISO/IEC 27001:2022 Clause
      9.2 and ISO/IEC 17021-1 (audit programmes).
    in_subset:
    - performance_evaluation
    from_schema: https://w3id.org/lmodel/iso27001
    exact_mappings:
    - iso42001:AuditType
    permissible_values:
      internal:
        text: internal
        description: First-party audit conducted by the organization itself per 9.2.
      external_second_party:
        text: external_second_party
        description: Audit conducted by a party with an interest in the organization
          (e.g., customer).
      external_third_party:
        text: external_third_party
        description: Independent audit by a certification body or other third party.
      surveillance:
        text: surveillance
        description: Periodic third-party audit between certification and recertification.
      recertification:
        text: recertification
        description: Third-party audit conducted to renew certification.
      combined:
        text: combined
        description: Audit performed jointly against two or more management system
          standards.
