description: 'A comprehensive LinkML schema modeling ISMS entities, workflows, and
  traceability links aligned to ISO/IEC 27001:2022 clause and Annex references. Designed
  for open data publication, automated validation, and integration with governance,
  risk, and compliance (GRC) systems.

  This schema captures: - ISMS lifecycle (establish, implement, maintain, improve)
  - Risk assessment and treatment processes (Clause 6.1) - Annex A control catalog
  structures organized by domain - Audit, measurement, and continual improvement artifacts'
title: 'ISO 27001 / ISMS: LinkML Schema'
