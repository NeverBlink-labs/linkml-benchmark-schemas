  SecurityIncidentCategory:
    name: SecurityIncidentCategory
    definition_uri: https://w3id.org/lmodel/iso27001/SecurityIncidentCategory
    annotations:
      annex_a_reference:
        tag: annex_a_reference
        value: A.5.24 / A.5.25
    description: Categories of information security incident used to classify events
      and incidents per ISO/IEC 27001:2022 Annex A controls A.5.24-A.5.28 and ISO/IEC
      27035 incident management guidance.
    in_subset:
    - annex_a_controls
    from_schema: https://w3id.org/lmodel/iso27001
    close_mappings:
    - iso42001:AIIncidentCategory
    related_mappings:
    - attack:AttackTactic
    permissible_values:
      malware:
        text: malware
        description: Malicious software, including viruses, worms, trojans, and ransomware.
        close_mappings:
        - stix:Malware
        related_mappings:
        - attack:tactic_ta0002
      ransomware:
        text: ransomware
        description: Malware encrypting or exfiltrating data for extortion.
        related_mappings:
        - attack:tactic_ta0040
        - stix:Malware
      phishing:
        text: phishing
        description: Social-engineering attempt to obtain credentials or trigger malicious
          action.
        close_mappings:
        - capec:capec_98
        related_mappings:
        - attack:tactic_ta0001
        - stix:AttackPattern
      social_engineering:
        text: social_engineering
        description: Manipulation of people to disclose information or perform unsafe
          actions.
      unauthorized_access:
        text: unauthorized_access
        description: Access to systems or data by a party without authorization.
        related_mappings:
        - attack:tactic_ta0001
      account_compromise:
        text: account_compromise
        description: Unauthorized control of a legitimate user or service account.
        related_mappings:
        - attack:tactic_ta0006
      privilege_misuse:
        text: privilege_misuse
        description: Authorized user exceeding or misusing their granted privileges.
        related_mappings:
        - attack:tactic_ta0004
      data_breach:
        text: data_breach
        description: Confirmed disclosure of confidential or personal information.
        related_mappings:
        - attack:tactic_ta0010
      data_loss:
        text: data_loss
        description: Loss of integrity or availability of information, including accidental
          deletion.
      denial_of_service:
        text: denial_of_service
        description: Disruption of availability through volumetric, protocol, or application
          attacks.
        close_mappings:
        - capec:capec_125
        related_mappings:
        - attack:tactic_ta0040
      web_application_attack:
        text: web_application_attack
        description: Attack targeting a web application (e.g., injection, XSS, broken
          auth).
      supply_chain:
        text: supply_chain
        description: Incident originating from a supplier, partner, or third-party
          component.
        related_mappings:
        - attack:technique_t1195
      insider_threat:
        text: insider_threat
        description: Malicious or negligent action by an internal party.
        related_mappings:
        - attack:tactic_ta0004
        - stix:ThreatActor
      physical_security:
        text: physical_security
        description: Theft, loss, or damage of physical assets or unauthorized physical
          access.
      configuration_error:
        text: configuration_error
        description: Misconfiguration leading to security exposure.
      cryptographic_failure:
        text: cryptographic_failure
        description: Weak, broken, or misused cryptography.
      policy_violation:
        text: policy_violation
        description: Failure to comply with information security policies or procedures.
      other:
        text: other
        description: Other incident type not covered by the listed categories.
