classes:
  NamedEntity:
    name: NamedEntity
    definition_uri: https://w3id.org/lmodel/iso27001/NamedEntity
    description: Abstract base class for all entities with an identifier, name, and
      description. Provides common identification and documentation slots.
    comments:
    - All concrete classes should inherit from this or a subclass
    - Ensures consistent identification across the schema
    from_schema: https://w3id.org/lmodel/iso27001
    exact_mappings:
    - iso42001:NamedEntity
    abstract: true
    slots:
    - NamedEntity_id
    - name
    - description
    - created_date
    - modified_date
    - version
    slot_usage:
      id:
        name: id
        description: Unique identifier for this entity instance.
        identifier: true
        required: true
    class_uri: iso27001:NamedEntity
  DocumentedInformation:
    name: DocumentedInformation
    definition_uri: https://w3id.org/lmodel/iso27001/DocumentedInformation
    annotations:
      iso27001_clause:
        tag: iso27001_clause
        value: '7.5'
    description: Abstract class for documented information per Clause 7.5. Captures
      metadata required for document control.
    comments:
    - Supports identification and control metadata for managed documents
    - Supports lifecycle, protection, and retention tracking
    in_subset:
    - documented_information
    from_schema: https://w3id.org/lmodel/iso27001
    exact_mappings:
    - iso42001:DocumentedInformation
    close_mappings:
    - oscal:OscalDocument
    related_mappings:
    - spdx:SpdxDocument
    is_a: NamedEntity
    abstract: true
    slots:
    - NamedEntity_id
    - name
    - description
    - created_date
    - modified_date
    - version
    - document_type
    - document_reference
    - author
    - owner
    - approved_by
    - approved_date
    - effective_date
    - review_date
    - status
    - classification
    - retention_period
    - distribution_controls
    - storage_and_preservation
    - change_control_method
    - external_origin
    - external_origin_source
    class_uri: iso27001:DocumentedInformation
  InformationSecurityManagementSystem:
    name: InformationSecurityManagementSystem
    definition_uri: https://w3id.org/lmodel/iso27001/InformationSecurityManagementSystem
    annotations:
      iso27001_clause:
        tag: iso27001_clause
        value: '4.4'
      mandatory:
        tag: mandatory
        value: 'true'
    description: Top-level container representing an organization's complete ISMS
      per ISO 27001. Aggregates all components required to support the full ISMS lifecycle.
    comments:
    - This is the root entity for any ISMS conformance dataset
    - Aggregates ISMS processes and their relationships
    - Includes explicit scope metadata and related governance artifacts
    - 'Reference: ISO/IEC 27001:2022 Clause 4.4. ISO/IEC standards text is copyright
      ISO - not reproduced here.'
    in_subset:
    - isms_core
    from_schema: https://w3id.org/lmodel/iso27001
    close_mappings:
    - iso42001:AIManagementSystem
    - oscal:SystemSecurityPlan
    related_mappings:
    - cis_controls:CISControlsDocument
    - iso29100:PrivacyFramework
    - nist_csf_v2:CSFDocument
    is_a: NamedEntity
    slots:
    - NamedEntity_id
    - name
    - description
    - created_date
    - modified_date
    - version
    - organization
    - top_management
    - governing_body
    - leadership_commitment_evidence
    - scope_statement
    - scope_boundaries
    - scope_exclusions
    - interfaces_and_dependencies
    - processes_and_interactions
    - context_internal_issues
    - context_external_issues
    - interested_parties
    - information_security_policy
    - objectives
    - risks_and_opportunities_actions
    - planned_changes
    - externally_provided_services
    - risk_assessment_process
    - risk_treatment_process
    - statement_of_applicability
    - controls
    - roles
    - resources
    - competence_records
    - awareness_program
    - communication_plan
    - documented_information_register
    - operational_procedures
    - risk_assessments
    - risk_treatment_plans
    - monitoring_program
    - internal_audits
    - management_reviews
    - nonconformities
    - corrective_actions
    - improvements
    - certification_status
    - certification_body
    - certification_date
    - recertification_date
    class_uri: iso27001:InformationSecurityManagementSystem
  Organization:
    name: Organization
    definition_uri: https://w3id.org/lmodel/iso27001/Organization
    annotations:
      iso27001_clause:
        tag: iso27001_clause
        value: '4.1'
      iso27001_amendment:
        tag: iso27001_amendment
        value: Amd. 1:2024
    description: The organization establishing and operating the ISMS. Captures context
      needed for Clause 4.1 (understanding the organization).
    comments:
    - Context determination per 4.1 feeds into ISMS planning
    - Climate change relevance determination added by Amd. 1:2024 to Clause 4.1
    - 'Reference: ISO/IEC 27001:2022 Clause 4.1 and Amd. 1:2024. ISO/IEC standards
      text is copyright ISO - not reproduced here.'
    in_subset:
    - isms_core
    from_schema: https://w3id.org/lmodel/iso27001
    exact_mappings:
    - iso42001:Organization
    close_mappings:
    - ocsf:Organization
    - oscal:Party
    - spdx:Organization
    - stix:Identity
    related_mappings:
    - iso29100:PIIController
    - iso29100:PIIProcessor
    is_a: NamedEntity
    slots:
    - NamedEntity_id
    - name
    - description
    - created_date
    - modified_date
    - version
    - legal_name
    - trading_names
    - organization_type
    - industry_sector
    - size_category
    - employee_count
    - geographic_locations
    - regulatory_jurisdictions
    - parent_organization
    - subsidiaries
    - climate_change_relevant
    class_uri: iso27001:Organization
  InterestedParty:
    name: InterestedParty
    definition_uri: https://w3id.org/lmodel/iso27001/InterestedParty
    annotations:
      iso27001_clause:
        tag: iso27001_clause
        value: '4.2'
      iso27001_amendment:
        tag: iso27001_amendment
        value: Amd. 1:2024
    description: A stakeholder whose needs and expectations are relevant to the ISMS
      per 4.2. Includes internal parties (employees, management) and external parties
      (customers, regulators, suppliers).
    comments:
    - Captures stakeholder needs and expectations relevant to ISMS scope
    - Requirements may include legal, regulatory, and contractual obligations
    - Relevant interested parties can have requirements related to climate change
      (Amd. 1:2024 Clause 4.2 Note 2)
    - 'Reference: ISO/IEC 27001:2022 Clause 4.2 and Amd. 1:2024. ISO/IEC standards
      text is copyright ISO - not reproduced here.'
    in_subset:
    - isms_core
    from_schema: https://w3id.org/lmodel/iso27001
    exact_mappings:
    - iso42001:InterestedParty
    close_mappings:
    - oscal:ResponsibleParty
    - stix:Identity
    related_mappings:
    - iso29100:PIIPrincipal
    - iso42001:CustomerRelationship
    - iso42001:SupplierRelationship
    - iso42001:ThirdPartyRelationship
    is_a: NamedEntity
    slots:
    - NamedEntity_id
    - name
    - description
    - created_date
    - modified_date
    - version
    - party_type
    - relationship
    - requirements
    - addressed_requirements
    - climate_change_related_requirements
    - communication_needs
    - contact_information
    class_uri: iso27001:InterestedParty
  InformationSecurityPolicy:
    name: InformationSecurityPolicy
    definition_uri: https://w3id.org/lmodel/iso27001/InformationSecurityPolicy
    annotations:
      iso27001_clause:
        tag: iso27001_clause
        value: '5.2'
      mandatory:
        tag: mandatory
        value: 'true'
    description: The information security policy established by top management per
      Clause 5.2. Provides framework for setting objectives and demonstrates commitment.
    comments:
    - Captures policy intent and governance commitments
    - Supports communication and acknowledgement tracking
